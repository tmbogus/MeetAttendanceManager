<!-- popup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meet Admin Overlay</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 320px;
      padding: 12px;
    }
    h2 {
      font-size: 15px;
      margin: 12px 0 8px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .user-list {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 10px;
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 4px 6px;
    }
    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #f1f1f1;
    }
    .user-item:last-child {
      border-bottom: none;
    }
    .remove-button {
      background-color: #e74c3c;
      color: #fff;
      border: none;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .remove-button:hover {
      background-color: #c0392b;
    }
    .add-user {
      display: flex;
      margin-bottom: 10px;
    }
    .add-user input {
      flex: 1;
      padding: 6px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .add-user button {
      margin-left: 6px;
      padding: 6px 10px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      background-color: #2ecc71;
      color: #fff;
      cursor: pointer;
    }
    .add-user button:hover {
      background-color: #27ae60;
    }
    .section {
      margin-bottom: 12px;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .small-btn {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      color: #111827;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .small-btn:hover { background: #e5e7eb; }
    .subtitle { color: #6b7280; font-size: 12px; margin-top: -4px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toggle">
      <input type="checkbox" id="toggle-enabled" />
      <label for="toggle-enabled">Enable overlay</label>
    </div>
    <div>
      <button id="export-data" class="small-btn">Export</button>
      <button id="import-data" class="small-btn">Import</button>
      <input type="file" id="import-file" accept="application/json" style="display:none" />
    </div>
  </div>
  <div class="subtitle">Manage who is allowed or banned. Changes sync live to the active Meet tab.</div>

  <div class="section">
    <h2>Ban Users</h2>
    <div class="add-user">
      <input type="text" id="ban-username" placeholder="Enter username" />
      <button id="ban-add">Add</button>
    </div>
    <div class="user-list" id="banned-users"></div>
  </div>

  <div class="section">
    <h2>Allow Users</h2>
    <div class="add-user">
      <input type="text" id="allow-username" placeholder="Enter username" />
      <button id="allow-add">Add</button>
    </div>
    <div class="user-list" id="allowed-users"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
